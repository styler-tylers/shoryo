<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>連鎖図 v1.0 — 大地震×サイバー攻撃</title>

<!-- changelog
v1.0 (2026-10-30) 初版
  - 東京・山梨・山口の3地域について、大地震からサイバー攻撃を経て社会影響に至る連鎖を時間軸(4段)で表示
  - 項目を選ぶと上流(原因)と下流(帰結)の連鎖が灯る(見せ場)
  - 分類レイヤー(物理被害/インフラ途絶/サイバー/社会影響)の切替、対策の重ね表示
  - 各項目に確度(根拠/推定/仮説)と出典を付記。3地域の比較表
-->

<style>
:root{
  /* 玄冬 */
  --ji:#171F2B; --men:#202A3C; --moji:#EAEFF5; --hojo:#8A93A5;
  --hi:#C8963E; --shu:#B3402E; --seiji:#6AA89D; --fuji:#8B7FA6;
  --sen:#303C53;
  --mincho:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --gothic:-apple-system,"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  --mono:"SF Mono","Menlo",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ji);color:var(--moji);font-family:var(--gothic);font-size:16px;line-height:1.8;
  -webkit-text-size-adjust:100%;min-height:100dvh}

header{padding:24px 24px 16px;padding-top:calc(24px + env(safe-area-inset-top));border-bottom:1px solid var(--sen)}
header h1{font-family:var(--mincho);font-weight:600;letter-spacing:.24em;font-size:28px;margin:0;line-height:1.4}
header h1 .ver{font-family:var(--mono);font-size:12px;letter-spacing:0;color:var(--hojo);margin-left:12px;vertical-align:middle}
header .sub{margin:4px 0 0;font-size:13px;color:var(--hojo);letter-spacing:.04em}

.ctrl{padding:16px 24px;border-bottom:1px solid var(--sen);display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row .lab{font-size:12px;color:var(--hojo);width:4.5em;flex:none}
button{font-family:var(--gothic);font-size:14px;line-height:1;min-height:44px;padding:0 16px;
  background:transparent;color:var(--hojo);border:1px solid var(--sen);border-radius:2px;
  cursor:pointer;touch-action:manipulation;letter-spacing:.04em}
button.on{color:var(--hi);border-color:var(--hi)}
button.layer{display:inline-flex;align-items:center;gap:8px}
button.layer i{width:10px;height:10px;border-radius:50%;background:var(--c);opacity:.35}
button.layer.on{color:var(--moji);border-color:var(--c)}
button.layer.on i{opacity:1}

.wrap{display:grid;grid-template-columns:1fr;gap:0}
@media(min-width:960px){.wrap{grid-template-columns:minmax(0,1fr) 380px}}

.summary{padding:20px 24px;border-bottom:1px solid var(--sen)}
.summary h2{font-family:var(--mincho);font-weight:600;font-size:20px;letter-spacing:.04em;margin:0 0 4px}
.summary .scen{font-size:14px;color:var(--hojo);margin:0 0 12px}
.facts{display:flex;flex-wrap:wrap;gap:8px 24px;margin:0;padding:0;list-style:none}
.facts li{font-size:14px}
.facts b{font-family:var(--mono);font-weight:500;color:var(--moji)}
.facts span{color:var(--hojo);font-size:12px;margin-right:6px}
.summary .note{font-size:12px;color:var(--hojo);margin:12px 0 0}

.flow{position:relative;padding:8px 24px 32px}
.flow svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.band{position:relative;padding:20px 0 8px}
.band+.band{border-top:1px dashed var(--sen)}
.bandhead{font-family:var(--mincho);font-size:13px;letter-spacing:.12em;color:var(--hojo);margin-bottom:12px}
.nodes{display:flex;flex-wrap:wrap;gap:16px 12px}
.node{position:relative;z-index:1;min-height:44px;padding:8px 12px 8px 14px;text-align:left;
  background:var(--men);color:var(--moji);border:1px solid var(--sen);border-left:3px solid var(--c);
  font-size:14px;line-height:1.5;max-width:100%;transition:opacity .2s}
.node.vuln{border-style:dashed;border-left-style:solid}
.node small{display:block;font-size:11px;color:var(--hojo);letter-spacing:.04em}
.node .mc{font-family:var(--mono);font-size:11px;color:var(--hi);margin-left:6px}
.node.dim{opacity:.22}
.node.sel{border-color:var(--hi);box-shadow:0 0 0 1px var(--hi),0 0 18px rgba(200,150,62,.45)}
.empty{color:var(--hojo);font-size:14px;padding:24px 0}

aside{border-left:1px solid var(--sen);background:var(--ji)}
.panel{padding:24px;position:sticky;top:0;max-height:100dvh;overflow:auto}
.panel h3{font-family:var(--mincho);font-weight:600;font-size:20px;letter-spacing:.04em;margin:0 0 8px;line-height:1.5}
.panel .meta{font-size:12px;color:var(--hojo);margin:0 0 16px;display:flex;flex-wrap:wrap;gap:8px}
.tag{border:1px solid var(--sen);padding:0 8px;border-radius:2px}
.tag.c-根拠{color:var(--seiji);border-color:var(--seiji)}
.tag.c-推定{color:var(--hi);border-color:var(--hi)}
.tag.c-仮説{color:var(--fuji);border-color:var(--fuji)}
.panel h4{font-size:12px;color:var(--hojo);font-weight:500;letter-spacing:.12em;margin:24px 0 8px}
.panel p{margin:0;font-size:15px}
.panel ul{margin:0;padding-left:1.2em;font-size:15px}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links button{min-height:36px;font-size:13px;padding:0 10px}
.panel a{color:var(--hi)}
.panel .close{display:none}
.hint{color:var(--hojo);font-size:14px}

@media(max-width:959px){
  aside{border-left:0}
  aside.open{position:fixed;left:0;right:0;bottom:0;z-index:10;border-top:1px solid var(--hi);
    max-height:62dvh;overflow:auto;padding-bottom:env(safe-area-inset-bottom)}
  aside:not(.open){display:none}
  .panel{position:static;max-height:none}
  .panel .close{display:inline-flex;align-items:center;float:right;margin:-8px -8px 0 8px}
}

.cmp{padding:20px 24px 40px;overflow-x:auto}
.cmp table{border-collapse:collapse;min-width:720px;width:100%;font-size:14px}
.cmp th,.cmp td{border-bottom:1px solid var(--sen);padding:12px;vertical-align:top;text-align:left}
.cmp th{font-family:var(--mincho);font-weight:600;letter-spacing:.04em}
.cmp td:first-child{color:var(--hojo);font-size:12px;width:7em}
.cmp .note{font-size:12px;color:var(--hojo);margin-top:16px}

footer{padding:24px;border-top:1px solid var(--sen);font-size:12px;color:var(--hojo)}
footer a{color:var(--hojo)}
</style>
</head>
<body>

<header>
  <h1>連鎖図<span class="ver">v1.0</span></h1>
  <p class="sub">大地震 × サイバー攻撃 — 東京・山梨・山口の被害連鎖と対策</p>
</header>

<div class="ctrl">
  <div class="row"><span class="lab">地域</span><div class="row" id="regions"></div></div>
  <div class="row" id="layerRow"><span class="lab">分類</span><div class="row" id="layers"></div></div>
  <div class="row" id="optRow"><span class="lab">表示</span><div class="row">
    <button id="tgMeasure">対策を重ねる</button>
  </div></div>
</div>

<div class="wrap" id="main">
  <div>
    <section class="summary" id="summary"></section>
    <section class="flow" id="flow"><svg id="edges"></svg><div id="bands"></div></section>
  </div>
  <aside id="aside"><div class="panel" id="panel"></div></aside>
</div>
<section class="cmp" id="cmp" hidden></section>

<footer>
  確度の凡例: <b>根拠</b>=公的想定・実例で裏付けあり / <b>推定</b>=根拠から推した連鎖 / <b>仮説</b>=検証が必要な研究上の仮説。
  数値は各想定の最大ケースで、前提条件(季節・時刻・風速)は出典を参照。研究ノート: <a href="README.md">README.md</a>
</footer>

/* ═══════════ state ═══════════ */
const state = {
  region:"tokyo",
  cats:new Set(Object.keys(DATA.cats)),
  measures:false,
  selected:null
};

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const byId=Object.fromEntries(DATA.nodes.map(n=>[n.id,n]));

function visibleNodes(){
  return DATA.nodes.filter(n=>n.r.includes(state.region)&&state.cats.has(n.cat));
}
function regionEdges(){
  const ids=new Set(DATA.nodes.filter(n=>n.r.includes(state.region)).map(n=>n.id));
  return DATA.edges.filter(([a,b,r])=>ids.has(a)&&ids.has(b)&&(!r||r.includes(state.region)));
}
/* 上流・下流をたどる(分類で隠れた項目も経由する) */
function chain(id){
  const es=regionEdges(), up=new Set(), down=new Set();
  const walk=(start,set,dir)=>{
    const st=[start];
    while(st.length){const x=st.pop();
      es.forEach(([a,b])=>{const [f,t]=dir?[a,b]:[b,a]; if(f===x&&!set.has(t)){set.add(t);st.push(t);}});}
  };
  walk(id,down,true); walk(id,up,false);
  return {up,down};
}

/* ═══════════ 描画 ═══════════ */
function renderControls(){
  $("regions").innerHTML=[...Object.entries(DATA.regions).map(([k,r])=>[k,r.name]),["compare","3地域の比較"]]
    .map(([k,n])=>`<button data-r="${k}" class="${state.region===k?"on":""}">${esc(n)}</button>`).join("");
  $("layers").innerHTML=Object.entries(DATA.cats)
    .map(([k,c])=>`<button class="layer ${state.cats.has(k)?"on":""}" data-c="${k}" style="--c:${c.color}"><i></i>${esc(c.name)}</button>`).join("");
  $("tgMeasure").classList.toggle("on",state.measures);
  const cmp=state.region==="compare";
  $("layerRow").hidden=cmp; $("optRow").hidden=cmp;
}

function renderSummary(){
  const r=DATA.regions[state.region];
  $("summary").innerHTML=`<h2>${esc(r.name)}</h2><p class="scen">${esc(r.scen)}</p>
    <ul class="facts">${r.facts.map(([k,v])=>`<li><span>${esc(k)}</span><b>${esc(v)}</b></li>`).join("")}</ul>
    <p class="note">${esc(r.note)}</p>`;
}

function renderFlow(){
  const vis=visibleNodes();
  const ch=state.selected?chain(state.selected):null;
  const lit=ch?new Set([state.selected,...ch.up,...ch.down]):null;
  $("bands").innerHTML=DATA.stages.map((s,i)=>{
    const ns=vis.filter(n=>n.stage===i);
    return `<div class="band"><div class="bandhead">${esc(s)}</div><div class="nodes">${
      ns.length?ns.map(n=>{
        const cls=["node",n.vuln?"vuln":"",lit&&!lit.has(n.id)?"dim":"",state.selected===n.id?"sel":""].join(" ");
        const mc=state.measures&&n.m.length?`<span class="mc">対策${n.m.length}</span>`:"";
        return `<button class="${cls}" data-n="${n.id}" style="--c:${DATA.cats[n.cat].color}">
          <small>${esc(DATA.cats[n.cat].name)}${n.vuln?"・脆弱状態":""}</small>${esc(n.label)}${mc}</button>`;
      }).join(""):`<div class="empty">この段に表示する項目はありません</div>`
    }</div></div>`;
  }).join("");
  if(vis.length===0) $("bands").innerHTML=`<p class="empty">分類がすべて非表示です。上の分類ボタンで表示を戻してください。</p>`;
  requestAnimationFrame(drawEdges);
}

function drawEdges(){
  const svg=$("edges"), box=$("flow").getBoundingClientRect();
  const pos={};
  document.querySelectorAll(".node").forEach(el=>{
    const r=el.getBoundingClientRect();
    pos[el.dataset.n]={x:r.left-box.left+r.width/2,top:r.top-box.top,bot:r.bottom-box.top,l:r.left-box.left,r:r.right-box.left};
  });
  const ch=state.selected?chain(state.selected):null;
  const upS=ch?new Set([state.selected,...ch.up]):null, dnS=ch?new Set([state.selected,...ch.down]):null;
  let paths="";
  regionEdges().forEach(([a,b])=>{
    const p=pos[a],q=pos[b]; if(!p||!q) return;
    const on=ch&&((upS.has(a)&&upS.has(b))||(dnS.has(a)&&dnS.has(b)));
    let d;
    if(q.top>p.bot-2){ const dy=(q.top-p.bot)/2; d=`M${p.x},${p.bot} C${p.x},${p.bot+dy} ${q.x},${q.top-dy} ${q.x},${q.top}`; }
    else if(p.top>q.bot-2){ /* 後の段から前の段へ戻る(状態を長引かせる)連鎖 */
      const dy=(p.top-q.bot)/2; d=`M${p.x},${p.top} C${p.x},${p.top-dy} ${q.x},${q.bot+dy} ${q.x},${q.bot}`; }
    else{ /* 同じ段:上側に弧を描く */
      const y=Math.min(p.top,q.top), x1=p.x<q.x?p.r-8:p.l+8, x2=p.x<q.x?q.l+8:q.r-8;
      d=`M${x1},${p.top} Q${(x1+x2)/2},${y-22} ${x2},${q.top}`; }
    paths+=`<path d="${d}" fill="none" stroke="${on?"#C8963E":"#303C53"}" stroke-width="${on?2:1.2}"
      stroke-opacity="${ch&&!on?.35:1}" marker-end="url(#${on?"ah":"an"})"/>`;
  });
  svg.innerHTML=`<defs>
    <marker id="an" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#303C53"/></marker>
    <marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#C8963E"/></marker>
  </defs>${paths}`;
}

function renderPanel(){
  const aside=$("aside");
  const n=state.selected&&byId[state.selected];
  if(!n){
    aside.classList.remove("open");
    $("panel").innerHTML=`<p class="hint">項目を選ぶと、その原因(上流)と帰結(下流)の連鎖が灯ります。破線の項目は、攻撃を招く「脆弱状態」です。</p>`;
    return;
  }
  const es=regionEdges();
  const ups=es.filter(e=>e[1]===n.id).map(e=>byId[e[0]]);
  const dns=es.filter(e=>e[0]===n.id).map(e=>byId[e[1]]);
  const lk=arr=>arr.length?`<div class="links">${arr.map(x=>`<button data-n="${x.id}">${esc(x.label)}</button>`).join("")}</div>`:`<p class="hint">なし</p>`;
  const rd=n.rd&&n.rd[state.region];
  $("panel").innerHTML=`<button class="close" id="closeP">閉じる</button>
    <h3>${esc(n.label)}</h3>
    <div class="meta"><span class="tag">${esc(DATA.cats[n.cat].name)}${n.vuln?"・脆弱状態":""}</span>
      <span class="tag">${esc(DATA.stages[n.stage])}</span><span class="tag c-${n.conf}">${esc(n.conf)}</span></div>
    <p>${esc(n.desc)}</p>
    ${rd?`<h4>${esc(DATA.regions[state.region].name)}では</h4><p>${esc(rd)}</p>`:""}
    <h4>原因(上流)</h4>${lk(ups)}
    <h4>帰結(下流)</h4>${lk(dns)}
    <h4>対策</h4><ul>${n.m.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
    <h4>出典</h4>${n.src.length?`<ul>${n.src.map(k=>`<li><a href="${DATA.sources[k].u}" target="_blank" rel="noopener">${esc(DATA.sources[k].t)}</a></li>`).join("")}</ul>`:`<p class="hint">個別の出典なし(研究上の推論)</p>`}`;
  aside.classList.add("open");
}

function renderCompare(){
  const regs=Object.values(DATA.regions);
  $("cmp").innerHTML=`<table><thead><tr><th></th>${regs.map(r=>`<th>${esc(r.name)}</th>`).join("")}</tr></thead>
    <tbody>${DATA.compare.rows.map(([k,...v])=>`<tr><td>${esc(k)}</td>${v.map(x=>`<td>${esc(x)}</td>`).join("")}</tr>`).join("")}</tbody></table>
    <p class="note">${esc(DATA.compare.note)}</p>`;
}

function render(){
  renderControls();
  const cmp=state.region==="compare";
  $("main").hidden=cmp; $("cmp").hidden=!cmp;
  if(cmp){renderCompare();return;}
  renderSummary(); renderFlow(); renderPanel();
}

/* ═══════════ 配線 ═══════════ */
$("regions").addEventListener("click",e=>{
  const b=e.target.closest("button[data-r]"); if(!b) return;
  state.region=b.dataset.r;
  if(state.selected&&(state.region==="compare"||!byId[state.selected].r.includes(state.region))) state.selected=null;
  history.replaceState(null,"","#"+state.region);
  render();
});
$("layers").addEventListener("click",e=>{
  const b=e.target.closest("button[data-c]"); if(!b) return;
  const c=b.dataset.c; state.cats.has(c)?state.cats.delete(c):state.cats.add(c);
  if(state.selected&&!state.cats.has(byId[state.selected].cat)) state.selected=null;
  render();
});
$("tgMeasure").addEventListener("click",()=>{state.measures=!state.measures;render();});
document.addEventListener("click",e=>{
  if(e.target.id==="closeP"){state.selected=null;render();return;}
  const b=e.target.closest("button[data-n]"); if(!b) return;
  const id=b.dataset.n;
  if(!state.cats.has(byId[id].cat)) state.cats.add(byId[id].cat);
  state.selected=state.selected===id&&b.classList.contains("node")?null:id;
  render();
});
window.addEventListener("resize",()=>requestAnimationFrame(drawEdges));

const h=location.hash.slice(1);
if(DATA.regions[h]||h==="compare") state.region=h;
render();
</script>
